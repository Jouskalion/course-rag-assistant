name: Codex review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck (does not request another AI review)
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

concurrency:
  group: codex-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  refresh-gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This privileged workflow only executes trusted main-branch code.
      # Never use a PR head/ref here, nor interpolate comment text into a script.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { run } = require('./.github/scripts/codex-review-gate.cjs');
            await run({ github, context, core });
